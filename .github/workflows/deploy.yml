name: deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: grid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - run: nix build -L
      - name: Deploy through the server configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: curl --fail-with-body --silent --show-error --output /dev/null --form-string "token=$GITLAB_TRIGGER_TOKEN" --form-string ref=main https://gitlab.com/api/v4/projects/87242023/trigger/pipeline
