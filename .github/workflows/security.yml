name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - run: nix develop -c go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: nix develop -c sh -c 'npm ci --ignore-scripts && npm audit --audit-level=low'
      - run: nix run nixpkgs#gitleaks -- git --redact --config .gitleaks.toml
